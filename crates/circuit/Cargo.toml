[package]
name = "openvm-rv32f-circuit"
description = "OpenVM circuit extension for RISC-V F (single-precision floating-point)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
openvm-stark-backend = { workspace = true }
openvm-cpu-backend = { workspace = true }
openvm-circuit-primitives = { workspace = true }
openvm-circuit-primitives-derive = { workspace = true }
openvm-circuit = { workspace = true }
openvm-circuit-derive = { workspace = true }
openvm-instructions = { workspace = true }
openvm-rv32im-circuit = { workspace = true }
openvm-rv32f-transpiler = { path = "../transpiler" }
openvm-rv32f-guest = { path = "../guest" }
derive-new = { workspace = true }
derive_more = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }

[features]
default = ["parallel"]
parallel = ["openvm-circuit/parallel"]

[dev-dependencies]
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.0.0", features = ["cpu-backend"] }
openvm-circuit = { git = "https://github.com/openvm-org/openvm", tag = "v2.0.1", default-features = false, features = ["test-utils"] }
openvm-rv32im-circuit = { git = "https://github.com/openvm-org/openvm", tag = "v2.0.1", default-features = false, features = ["test-utils"] }
rand = "0.9"
