[package]
name = "openvm-rv32f-example"
description = "Example and integration tests for the OpenVM RISC-V F extension"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
openvm-stark-sdk = { workspace = true }
openvm-circuit = { workspace = true, features = ["test-utils"] }
openvm-instructions = { workspace = true }
openvm-transpiler = { workspace = true }
openvm-build = { git = "https://github.com/xxuejie/openvm.git", rev = "2c97976209bdb06c994990581a3b64ab53d1e3f1" }
openvm-rv32f-circuit = { path = "../circuit" }
openvm-rv32f-transpiler = { path = "../transpiler" }

[dev-dependencies]
openvm-rv32im-circuit = { workspace = true, default-features = false }
openvm-rv32im-transpiler = { workspace = true }

[features]
default = []
proving = []
